#
# Unit tests: PHPUnit (needs the OCP interfaces of a Nextcloud server tree, the
# server is not booted) and Vitest for the Vue frontend.
name: Tests

on:
  pull_request: {}
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: mail_roundcube

jobs:
  phpunit:
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - name: Checkout Nextcloud server
        uses: actions/checkout@v5
        with:
          repository: nextcloud/server
          ref: stable35
          submodules: recursive
          path: server
          persist-credentials: false

      - name: Checkout app
        uses: actions/checkout@v5
        with:
          path: server/apps/${{ env.APP_NAME }}
          submodules: recursive
          persist-credentials: false

      - name: Install xpath
        # the Makefile reads the app info from info.xml
        run: sudo apt-get install -y --no-install-recommends libxml-xpath-perl rsync

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, posix, simplexml, xml, zip
          coverage: xdebug
          tools: composer:v2
          ini-values: memory_limit=1G

      - name: Run PHPUnit
        working-directory: server/apps/${{ env.APP_NAME }}
        run: make phpunit PHPCOVERAGE='-d xdebug.mode=coverage'

      - name: Upload PHPUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-reports
          path: server/apps/${{ env.APP_NAME }}/build/artifacts/tests/phpunit/
          if-no-files-found: ignore

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
