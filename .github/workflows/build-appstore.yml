# SPDX-License-Identifier: AGPL-3.0-or-later
# Reusable workflow building the ready-to-use app archive (the same
# artifact as `make appstore`) and uploading it as a workflow artifact.
# It serves both as the build stage of the release workflow and as a
# check on pull requests, so the two can never drift apart.
name: Build app archive

on:
  workflow_call:
    outputs:
      version:
        description: The app version read from appinfo/info.xml
        value: ${{ jobs.build.outputs.version }}
      artifact:
        description: Name of the uploaded tarball artifact
        value: mail_roundcube-${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server/apps/mail_roundcube
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Use HTTPS for submodules
        working-directory: .
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # PHP-to-TypeScript generation requires an installed Nextcloud server.
      - name: Checkout Nextcloud
        uses: actions/checkout@v5
        with:
          repository: rotdrop/nextcloud-server
          ref: cjh-stable35
          submodules: recursive
          path: server
          persist-credentials: false

      - name: Checkout app
        uses: actions/checkout@v5
        with:
          path: server/apps/mail_roundcube
          submodules: recursive
          persist-credentials: false

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml-xpath-perl rsync

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, openssl, pdo_sqlite, posix, sqlite3, xml, zip, apcu, bcmath, gmp, imagick
          tools: composer:v2
          coverage: none
          ini-values: apc.enable_cli=1, memory_limit=1G

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Nextcloud
        working-directory: server
        run: |
          composer install --no-interaction --no-progress
          php occ maintenance:install --database=sqlite \
            --admin-user=admin --admin-pass=admin --no-interaction

      - name: Read app version
        id: meta
        run: |
          version=$(php -r 'echo (string)simplexml_load_file("appinfo/info.xml")->version;')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build app archive
        run: make appstore APP_VERSION=${{ steps.meta.outputs.version }}

      - name: Sanity-check the build
        # `make appstore` exits 0 even when the webpack build emits nothing, so
        # guard against shipping a tarball without JS bundles.
        run: |
          count=$(tar tzf build/artifacts/appstore/mail_roundcube-${{ steps.meta.outputs.version }}.tar.gz | grep -Ec 'mail_roundcube/js/.*\.m?js$' || true)
          echo "JS bundles in archive: $count"
          test "$count" -gt 0 || { echo "::error::No JS bundles in the archive - the webpack build produced nothing"; exit 1; }

      - name: Name the artifact after the version
        run: cp build/artifacts/appstore/mail_roundcube-${{ steps.meta.outputs.version }}.tar.gz "mail_roundcube-${{ steps.meta.outputs.version }}.tar.gz"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: mail_roundcube-${{ steps.meta.outputs.version }}
          path: server/apps/mail_roundcube/mail_roundcube-${{ steps.meta.outputs.version }}.tar.gz
          if-no-files-found: error
